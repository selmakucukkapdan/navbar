<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepsi Navbar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f4f4f4; 
            font-family: Arial, sans-serif;
        }
        .container, .container2, .container3 {
            width: 100%;
         
            height: 80px;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); 
            border-radius: 0 0 20px 20px; 
        }
        .container{
            background-color: #E32934;
        }
        .container2{
            background-color: #005CB4;
        }
        .container3{
            background-color: #f4f4f4;
        }

        .container3 .navbar a{
            color: black;
        }


        .container {
            margin-bottom: 20px;
            position: fixed; 
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .container2 {
            margin: 120px 0 20px 0; 
        }

        .container3 {
            margin-bottom: 20px;
        }

        .logo-navbar {
            display: flex;
            align-items: center;
        }
        img {
            width: 120px;
            margin-right: 30px;
            filter: drop-shadow(0 0 15px #005CB4); 
            transition: transform 0.3s ease; 
        }
        img:hover {
            transform: scale(1.1); 
        }
        .navbar {
            display: flex;
            align-items: center;
        }
        .navbar a {
            text-decoration: none;
            color: #FFFFFF;
            margin-right: 30px;
            font-size: 18px;
            position: relative;
            transition: color 0.3s ease;
        }
      
        .inputsearch {
            display: flex;
            align-items: center;
            margin-right: 20px;
        }
        input[type="search"], input[type="text"] {
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            margin-right: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease;
            font-size: 16px;
        }
        input[type="search"]:focus, input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 10px #005CB4; 
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #005CB4, #0096FF); 
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-left: 10px;
            margin-right: 40px;
        }
        button:hover {
            transform: scale(1.1); 
            box-shadow: 0 0 15px #0096FF; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-navbar">
            <img src="logo.png" alt="Pepsi Logo">
            <div class="navbar">
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#">About</a>
            </div>
        </div>
        <div class="inputsearch">
            <input type="search" placeholder="Search">
            <button>Search</button>
        </div>
    </div>


    <div class="container2">
        <div class="logo-navbar">
            <img src="logo.png" alt="Pepsi Logo">
            <div class="navbar">
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#">About</a>
            </div>
        </div>
        <div class="inputsearch">
            <input type="text" placeholder="Search">
            <button>Search</button>
        </div>
    </div>


    <div class="container3">
        <div class="logo-navbar">
            <img src="logo.png" alt="Pepsi Logo">
            <div class="navbar">
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#">About</a>
            </div>
        </div>
        <div class="inputsearch">
            <input type="text" placeholder="Search">
            <button>Search</button>
        </div>
    </div>
</body>
</html>
